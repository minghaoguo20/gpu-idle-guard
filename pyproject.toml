[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-idle-guard"
version = "0.1.0"
description = "Read-only NVIDIA GPU process activity monitoring and idle policy simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "nvidia-ml-py>=12",
    "psutil>=5.9",
]

[project.scripts]
gpu-idle-guard = "gpu_idle_guard:main"

[tool.setuptools]
py-modules = ["gpu_idle_guard"]
include-package-data = false
